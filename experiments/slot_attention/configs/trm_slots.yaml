# Slot Attention + Contrastive Learning Configuration
# Based on TRM with additional slot attention and contrastive learning

arch:
  name: recursive_reasoning.trm_with_slots@TRM_WithSlots_ACTV1

  # Loss configuration
  loss:
    name: slot_losses@SlotContrastiveLossHead
    loss_type: softmax_cross_entropy
    slot_recon_weight: 0.5  # Weight for slot reconstruction loss
    slot_contrastive_weight: 0.1  # Weight for slot contrastive loss
    use_hungarian_matching: true  # Use Hungarian matching for slot alignment

  # TRM core configuration (same as baseline)
  halt_exploration_prob: 0.2
  halt_max_steps: 16

  H_cycles: 16
  L_cycles: 6

  H_layers: 0
  L_layers: 2

  hidden_size: 512
  num_heads: 8
  expansion: 2.0

  puzzle_emb_ndim: 8192
  puzzle_emb_len: 16

  pos_encodings: rope
  forward_dtype: bfloat16

  mlp_t: true
  no_ACT_continue: true

  # Slot Attention specific configuration
  num_slots: 8  # Number of slots for decomposition
  slot_dim: 256  # Dimension of each slot
  slot_iterations: 3  # Number of iterative refinement steps
  use_slot_decoder: true  # Use decoder for slot-based reconstruction

# Data configuration
data_paths:
  - data/arc-agi/arc_dataset_train

data_paths_test:
  - data/arc-agi/arc_dataset_train

# Training hyperparameters
global_batch_size: 64
epochs: 200

# Learning rates
lr: 2.0e-4
lr_min_ratio: 0.1
lr_warmup_steps: 1000

weight_decay: 0.01
beta1: 0.9
beta2: 0.98

# Puzzle embedding optimizer
puzzle_emb_lr: 1.0e-3
puzzle_emb_weight_decay: 0.01

# Evaluation and checkpointing
eval_interval: 10
min_eval_interval: 0
checkpoint_every_eval: true

# WandB logging
project_name: "TRM-SlotAttention"
run_name: null  # Auto-generated

# Evaluators
evaluators:
  - name: evaluators.arc@ARC
    submission_K: 2
    pass_Ks: [1, 2, 5, 10]
    aggregated_voting: true

# Misc
seed: 42
ema: false
freeze_weights: false

eval_save_outputs:
  - slots  # Save slot representations for analysis
